name: ride_app
description: "Ride-hailing rider app built with Flutter (sample / practice project)."
publish_to: "none"

# App Versioning
# version: MAJOR.MINOR.PATCH+BUILD
version: 3.0.4+43

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── UI ─────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.14.0
  # ── State Management ───────────────────────────────────────────────────
  # flutter_riverpod: ^3.2.1
  # riverpod_annotation: ^4.0.2
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  flutter_rating_bar: ^4.0.1
  flutter_bounceable: ^1.2.0

  # ── Networking ─────────────────────────────────────────────────────────
  dio: ^5.9.1

  # ── Functional Programming ─────────────────────────────────────────────
  fpdart: ^1.2.0

  # ── Routing ──────────────────────────────────────────────────────────────
  go_router: ^17.1.0

  # ── Local Storage ──────────────────────────────────────────────────────
  shared_preferences: ^2.5.3

  # ── Date Formatting ────────────────────────────────────────────────────
  intl: ^0.20.2
  get_it: ^9.2.0
  flutter_localizations:
    sdk: flutter
  gradient_borders: ^1.0.2
  image_picker: ^1.2.1
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  dotted_border: ^3.1.0
  photo_view: ^0.15.0
  fluttertoast: ^9.0.0
  loading_animation_widget: ^1.3.0
  geolocator: ^14.0.2
  permission_handler: ^11.3.1
  # dartz: ^0.10.1
  # Keep Firebase plugins aligned with FlutterFire BoM 4.20.0 (Apple SDK 12.19.0).
  # Their Swift Package Manager manifests pin the native SDK exactly.
  firebase_auth: ^6.7.0
  # geocoding: ^4.0.0
  place_picker_google: ^0.0.20
  flutter_polyline_points: ^2.1.0
  google_maps_utils: ^2.0.0
  flutter_svg: ^2.2.3
  mask_text_input_formatter: ^2.9.0
  pinput: ^6.0.2
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^19.4.0
  flutter_stripe: ^11.3.0
  firebase_core: ^4.15.0
  device_info_plus: ^12.3.0
  socket_io_client: ^3.1.4
  animated_segmented_tab_control: ^2.0.0

  url_launcher: ^6.3.1
  share_plus: ^11.1.0
  simple_ripple_animation: ^0.1.0
  # ---------------- Configuration & Environment ----------------
  firebase_remote_config: ^6.7.0
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0
  flutter_screenutil: ^5.9.3
  #  gif_view: ^1.0.3
  lottie: ^3.3.3
  package_info_plus: ^9.0.1
  flutter_zoom_drawer: ^3.2.0
  flutter_animate: ^4.5.2
  flutter_sound: ^9.30.0
  firebase_crashlytics: ^5.4.0

  logger: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Riverpod Code Generation ─────────────────────────────────────────
  # riverpod_generator: ^3.0.3
  # build_runner: ^2.4.14
  # custom_lint: ^0.7.5
  # riverpod_lint: ^3.0.2

  path: any
  mocktail: ^1.0.5
  google_maps_flutter_platform_interface: ^2.16.0
flutter:
  generate: true
  uses-material-design: true

  # Uncomment and add your custom fonts:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  assets:
    - assets/icons/
    - assets/lottie/
    - assets/images/
    - assets/map_style/dark_map.json
    - assets/map_style/light_map.json
    - assets/sounds/
    - shorebird.yaml
